services:
  glance:
    image: glanceapp/glance:v0.8.6
    restart: unless-stopped
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_USERS_LOSI57304_PASSWORD: ${AUTH_USERS_LOSI57304_PASSWORD}
      WEATHER_LOCATION: ${WEATHER_LOCATION}
    networks:
      - proxy
    volumes:
      - /srv/glance/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./glance.yaml:/app/config/glance.yml:ro
    security_opt:
      - no-new-privileges:true
    labels:
      glance.icon: sh:glance-light
      glance.name: Glance
      glance.url: https://dashboard.ocd.beauty

networks:
  proxy:
    external: true
