x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  beszel:
    <<: *common
    image: henrygd/beszel:0.19.0
    networks:
      - proxy
    volumes:
      - /run/beszel:/run/beszel
      - /srv/beszel/data:/beszel_data
    labels:
      glance.icon: sh:beszel-light
      glance.name: Beszel
      glance.url: https://monitoring.ocd.beauty

  beszel-agent:
    <<: *common
    image: henrygd/beszel-agent:0.19.0
    depends_on:
      - beszel
    environment:
      KEY: ${BESZEL_AGENT_KEY}
      LISTEN: /run/beszel/beszel.sock
      TOKEN: ${BESZEL_AGENT_TOKEN}
    volumes:
      - /run/beszel:/run/beszel
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      glance.hide: true

networks:
  proxy:
    external: true
