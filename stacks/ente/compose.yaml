x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  labels:
    glance.hide: true

services:
  ente-garage:
    <<: *common
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    networks:
      - default
      - proxy
    volumes:
      - /srv/ente/garage/data:/var/lib/garage/data
      - /srv/ente/garage/meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro

  ente-postgres:
    <<: *common
    image: postgres:18.6
    environment:
      PGDATA: /var/lib/postgresql/18/data
      POSTGRES_DB: ente_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: pguser
    networks:
      - default
    volumes:
      - /srv/ente/postgres/data:/var/lib/postgresql

  ente-server:
    <<: *common
    image: ghcr.io/ente/server:163f45c26f130090abed03649530f53d2d976565
    depends_on:
      - ente-garage
      - ente-postgres
    environment:
      ENTE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENTE_JWT_SECRET: ${ENTE_JWT_SECRET}
      ENTE_KEY_ENCRYPTION: ${ENTE_KEY_ENCRYPTION}
      ENTE_KEY_HASH: ${ENTE_KEY_HASH}
      ENTE_S3_B2_EU_CEN_KEY: ${ENTE_S3_B2_EU_CEN_KEY}
      ENTE_S3_B2_EU_CEN_SECRET: ${ENTE_S3_B2_EU_CEN_SECRET}
      GIN_MODE: release
    networks:
      - default
      - proxy
    volumes:
      - /srv/ente/server/data:/data
      - ./credentials.yaml:/credentials.yaml:ro
      - ./museum.yaml:/museum.yaml:ro

networks:
  proxy:
    external: true
