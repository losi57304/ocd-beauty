services:
  ente-garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    networks:
      - default
    volumes:
      - /srv/ente/garage/data:/var/lib/garage/data
      - /srv/ente/garage/meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    restart: unless-stopped
    labels:
      glance.hide: true
    security_opt:
      - no-new-privileges:true

  ente-postgres:
    image: postgres:18.6
    environment:
      PGDATA: /var/lib/postgresql/18/data
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - default
    volumes:
      - /srv/ente/postgres/data:/var/lib/postgresql
    labels:
      glance.hide: true
    security_opt:
      - no-new-privileges:true

  ente-server:
    image: ghcr.io/ente/server:163f45c26f130090abed03649530f53d2d976565
    depends_on:
      - ente-garage
      - ente-postgres
    environment:
      ENTE_DB_HOST: ente-postgres
      ENTE_DB_NAME: ${POSTGRES_DB}
      ENTE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENTE_DB_USER: ${POSTGRES_USER}
      ENTE_INTERNAL_HARDCODED_OTT_LOCAL_DOMAIN_SUFFIX: ${ENTE_INTERNAL_HARDCODED_OTT_LOCAL_DOMAIN_SUFFIX}
      ENTE_INTERNAL_HARDCODED_OTT_LOCAL_DOMAIN_VALUE: ${ENTE_INTERNAL_HARDCODED_OTT_LOCAL_DOMAIN_VALUE}
      ENTE_JWT_SECRET: ${ENTE_JWT_SECRET}
      ENTE_KEY_ENCRYPTION: ${ENTE_KEY_ENCRYPTION}
      ENTE_KEY_HASH: ${ENTE_KEY_HASH}
      ENTE_S3_B2_EU_CEN_ENDPOINT: ente-garage:3900
      ENTE_S3_B2_EU_CEN_BUCKET: garage
      ENTE_S3_B2_EU_CEN_USE_PATH_STYLE: true
      ENTE_S3_B2_EU_CEN_KEY: ${ENTE_S3_B2_EU_CEN_KEY}
      ENTE_S3_B2_EU_CEN_SECRET: ${ENTE_S3_B2_EU_CEN_SECRET}
      GIN_MODE: release
    networks:
      - default
      - proxy
    volumes:
      - /srv/ente/server/data:/data
    restart: unless-stopped
    labels:
      glance.hide: true
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
