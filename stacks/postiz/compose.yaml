x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  labels:
    glance.hide: true

services:
  postiz-postgres:
    <<: *common
    image: postgres:18.6
    environment:
      PGDATA: /var/lib/postgresql/18/data
      POSTGRES_DB: postiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postiz
    networks:
      - default
    volumes:
      - /srv/postiz/postgres/data:/var/lib/postgresql

  postiz-redis:
    <<: *common
    image: redis:8.2.10
    networks:
      - default
    volumes:
      - /srv/postiz/redis/data:/data

  postiz-temporal:
    <<: *common
    image: temporalio/auto-setup:1.28.4
    depends_on:
      - postiz-postgres
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postiz-postgres
      POSTGRES_USER: postiz
    networks:
      - default

  postiz:
    <<: *common
    image: ghcr.io/gitroomhq/postiz-app:v2.25.0
    depends_on:
      - postiz-postgres
      - postiz-redis
      - postiz-temporal
    environment:
      BACKEND_INTERNAL_URL: http://localhost:3000
      DATABASE_URL: postgresql://postiz:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
      FRONTEND_URL: https://postiz.ocd.beauty
      IS_GENERAL: true
      JWT_SECRET: ${JWT_SECRET}
      MAIN_URL: https://postiz.ocd.beauty
      NEXT_PUBLIC_BACKEND_URL: https://postiz.ocd.beauty/api
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      REDIS_URL: redis://postiz-redis:6379
      RUN_CRON: true
      STORAGE_PROVIDER: local
      TEMPORAL_ADDRESS: postiz-temporal:7233
      UPLOAD_DIRECTORY: /uploads
    networks:
      - default
      - proxy
    volumes:
      - /srv/postiz/uploads:/uploads
    labels:
      glance.icon: sh:postiz
      glance.name: Postiz
      glance.url: https://postiz.ocd.beauty

networks:
  proxy:
    external: true
